<style>
  :root {

    --text: #c8ccd4;

    --accent: #00e5ff;
    --danger: #ff3d4f;
    --warning: #ffab00;
    --loot: #ff6d00;
    --spawn: #00e676;
    --extract: #448aff;

    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    overflow-x: hidden;
  }
  .app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .app-header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #fff;
  }
  .app-header .subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: 4px;
  }
  .mode-tabs {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }
  .mode-tab {
    padding: 6px 16px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .mode-tab:hover { border-color: #555; color: #ddd; }
  .mode-tab.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 600;
  }
  .main-layout {
    display: flex;
    height: calc(100vh - 65px);
  }
  .sidebar {
    width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 8px 0;
    flex-shrink: 0;
  }
  .sidebar-section {
    padding: 8px 16px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    font-weight: 600;
  }
  .map-item {
    padding: 10px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.15s;
    border-left: 3px solid transparent;
    font-size: 13px;
  }
  .map-item:hover { background: rgba(255,255,255,0.03); }
  .map-item.active {
    background: rgba(0,229,255,0.06);
    border-left-color: var(--accent);
    color: #fff;
  }
  .map-item .difficulty-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .map-item .map-name { flex:1; }
  .map-item .map-mode {
    font-size: 10px;
    color: var(--text-muted);
    background: rgba(255,255,255,0.05);
    padding: 2px 6px;
    border-radius: 3px;
  }
  .content-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .radar-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background:
      radial-gradient(circle at center, rgba(0,229,255,0.03) 0%, transparent 70%),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
  }
  .radar-container canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
  }
  .info-panel {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-shrink: 0;
  }
  .info-block h3 {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .info-block .value {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
  }
  .stat-grid {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
  }
  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .stat-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .stat-value {
    font-size: 13px;
    font-weight: 600;
    color: #ddd;
  }
  .legend-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-left: auto;
  }
  .legend-dot {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .legend-dot::before {
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .legend-dot.spawn::before { background: var(--spawn); }
  .legend-dot.extract::before { background: var(--extract); }
  .legend-dot.loot::before { background: var(--loot); }
  .legend-dot.danger::before { background: var(--danger); }
  .legend-dot.boss::before { background: var(--warning); }
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(10,14,20,0.95);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    color: #ddd;
    z-index: 200;
    display: none;
    max-width: 200px;
  }
  .map-label {
    position: absolute;
    top: 16px;
    left: 24px;
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(0,229,255,0.3);
    pointer-events: none;

</style>

let currentMode = 'hazard';
let currentMap = MAPS.hazard[0];
let hoveredPoint = null;
let mouseX = 0, mouseY = 0;

// ==================== CANVAS SETUP ====================
const canvas = document.getElementById('radarCanvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const container = document.getElementById('radarContainer');

function resize() {
  const rect = container.getBoundingClientRect();
  const size = Math.min(rect.width - 40, rect.height - 40, 900);
  canvas.width = size;
  canvas.height = size;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
}
window.addEventListener('resize', () => { resize(); draw(); });
resize();

// ==================== DRAWING FUNCTIONS ====================
function tx(x) { return x * canvas.width; }
function ty(y) { return y * canvas.height; }
function ts(s) { return s * canvas.width; }

function drawGrid() {
  const s = canvas.width;
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  const step = s / 20;
  for (let i = 0; i <= 20; i++) {
    ctx.beginPath();
    ctx.moveTo(i * step, 0);
    ctx.lineTo(i * step, s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * step);
    ctx.lineTo(s, i * step);
    ctx.stroke();
  }
}

function drawCompassRose() {
  const s = canvas.width;
  const cx = s - 50, cy = 50, r = 28;
  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();
  // N arrow
  ctx.fillStyle = '#ff3d4f';
  ctx.beginPath();
  ctx.moveTo(cx, cy - r + 4);
  ctx.lineTo(cx - 5, cy - 2);
  ctx.lineTo(cx + 5, cy - 2);
  ctx.closePath();
  ctx.fill();
  // S arrow
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.moveTo(cx, cy + r - 4);
  ctx.lineTo(cx - 5, cy + 2);
  ctx.lineTo(cx + 5, cy + 2);
  ctx.closePath();
  ctx.fill();
  // Labels
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('N', cx, cy - r - 4);
}

function drawScaleBar() {
  const s = canvas.width;
  const x = 40, y = s - 25;
  const barW = ts(0.12);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + barW, y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y - 6);
  ctx.lineTo(x, y + 6);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + barW, y - 6);
  ctx.lineTo(x + barW, y + 6);
  ctx.stroke();
  ctx.fillStyle = '#aaa';
  ctx.font = '10px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  const label = currentMap.size && currentMap.size.includes('大') ? '~120m' : currentMap.size && currentMap.size.includes('小') ? '~60m' : '~90m';
  ctx.fillText(label, x + barW / 2, y - 8);
}

function drawTerrain() {
  const s = canvas.width;
  // Base terrain fill
  ctx.fillStyle = '#0f1923';
  ctx.fillRect(0, 0, s, s);

  // Draw water areas
  if (currentMap.terrain) {
    currentMap.terrain.forEach(t => {
      if (t.type === 'water') {
        ctx.fillStyle = '#0a1a2e';
        ctx.fillRect(tx(t.x), ty(t.y), ts(t.w), ts(t.h));
        // Water ripples
        ctx.strokeStyle = 'rgba(30,80,130,0.3)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < 6; i++) {
          const ry = ty(t.y) + ts(t.h) * (0.1 + i * 0.14);
          ctx.beginPath();
          ctx.moveTo(tx(t.x), ry);
          ctx.bezierCurveTo(tx(t.x + t.w*0.25), ry + 3, tx(t.x + t.w*0.75), ry - 3, tx(t.x + t.w), ry);
          ctx.stroke();
        }
      }
    });
  }

  // Draw road outlines
  if (currentMap.terrain) {
    currentMap.terrain.forEach(t => {
      if (t.type === 'road') {
        ctx.fillStyle = '#1a2430';
        ctx.fillRect(tx(t.x), ty(t.y), ts(t.w), ts(t.h));
        // Dashed center line
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.setLineDash([8, 12]);
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(tx(t.x), ty(t.y + t.h/2));
        ctx.lineTo(tx(t.x + t.w), ty(t.y + t.h/2));
        ctx.stroke();
        ctx.setLineDash([]);
      }
    });
  }
}

function drawBuilding(b, index) {
  const x = tx(b.x), y = ty(b.y);
  const w = ts(b.w), h = ts(b.h);
  const isHovered = hoveredPoint && hoveredPoint.type === 'building' && hoveredPoint.index === index;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(x + 3, y + 3, w, h);

  // Building body
  const isHighValue = b.highValue;
  if (isHovered) {
    ctx.fillStyle = isHighValue ? '#3a2a00' : '#2a3040';
  } else {
    ctx.fillStyle = isHighValue ? '#2a2000' : '#1a2030';
  }
  ctx.fillRect(x, y, w, h);

  // 3D-like roof offset for buildings with floors > 1
  if (b.floors > 1) {
    const roofOffset = Math.min(b.floors * 1.5, 6);
    ctx.fillStyle = isHovered
      ? (isHighValue ? '#4a3500' : '#344050')
      : (isHighValue ? '#352800' : '#222d3d');
    ctx.fillRect(x + roofOffset, y - roofOffset, w, h);
    // Sides for 3D effect
    ctx.fillStyle = isHighValue ? '#352800' : '#1c2636';
    ctx.fillRect(x + w, y - roofOffset, roofOffset, h + roofOffset);
    ctx.fillStyle = isHighValue ? '#2a2000' : '#151d2a';
    ctx.fillRect(x + roofOffset, y + h, w, roofOffset);
  }

  // Border
  ctx.strokeStyle = isHovered
    ? (isHighValue ? '#ffab00' : '#00e5ff')
    : (isHighValue ? 'rgba(255,171,0,0.4)' : 'rgba(255,255,255,0.15)');
  ctx.lineWidth = isHovered ? 2 : 1;
  ctx.strokeRect(x, y, w, h);

  // Floor indicator dots on top-left
  if (b.floors > 1) {
    for (let i = 0; i < Math.min(b.floors, 5); i++) {
      ctx.fillStyle = isHighValue ? '#ffab00' : '#00e5ff';
      ctx.beginPath();
      ctx.arc(x + 8 + i * 8, y + 10, 2, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // Label
  ctx.fillStyle = isHovered ? '#fff' : (isHighValue ? '#ffcc80' : '#c8ccd4');
  ctx.font = `${isHovered ? 'bold ' : ''}${Math.max(10, Math.min(13, w/8))}px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(b.label, x + w/2, y + h/2 + 4);
}

function drawSpawnPoints() {
  currentMap.spawns.forEach((sp, i) => {
    const x = tx(sp.x), y = ty(sp.y);
    const isHovered = hoveredPoint && hoveredPoint.type === 'spawn' && hoveredPoint.index === i;
    const r = isHovered ? 7 : 5;
    // Outer glow
    const grad = ctx.createRadialGradient(x, y, r*0.5, x, y, r*2.5);
    grad.addColorStop(0, 'rgba(0,230,118,0.6)');
    grad.addColorStop(1, 'rgba(0,230,118,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r*2.5, 0, Math.PI*2);
    ctx.fill();
    // Dot
    ctx.fillStyle = '#00e676';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();

    if (isHovered) {
      ctx.fillStyle = '#fff';
      ctx.font = '10px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`出生点 #${i+1}`, x + 10, y + 4);
    }
  });
}

function drawExtracts() {
  currentMap.extracts.forEach((ex, i) => {
    const x = tx(ex.x), y = ty(ex.y);
    const isHovered = hoveredPoint && hoveredPoint.type === 'extract' && hoveredPoint.index === i;
    const size = isHovered ? 12 : 9;
    // Diamond
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.PI/4);
    ctx.fillStyle = ex.type === '拉闸' || ex.type === '双拉闸' ? '#448aff'
      : ex.type === '丢包' ? '#ff6d00'
      : ex.type === '直升机' ? '#e040fb'
      : ex.type === '付费' ? '#ffd740'
      : ex.type === '管道' ? '#69f0ae'
      : '#448aff';
    ctx.fillRect(-size, -size, size*2, size*2);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-size, -size, size*2, size*2);
    ctx.restore();

    if (isHovered) {
      ctx.fillStyle = '#fff';
      ctx.font = '10px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`${ex.label} [${ex.type}]`, x + 14, y + 4);
    }
  });
}

function drawHotZones() {
  currentMap.hotZones.forEach((hz, i) => {
    const x = tx(hz.x), y = ty(hz.y);
    const r = ts(hz.r);
    // Pulsing effect - outer ring
    const grad = ctx.createRadialGradient(x, y, r*0.3, x, y, r);
    grad.addColorStop(0, 'rgba(255,61,79,0.15)');
    grad.addColorStop(0.5, 'rgba(255,61,79,0.08)');
    grad.addColorStop(1, 'rgba(255,61,79,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
    // Border
    ctx.strokeStyle = 'rgba(255,61,79,0.35)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    // Label
    ctx.fillStyle = 'rgba(255,61,79,0.8)';
    ctx.font = 'bold 10px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(hz.label, x, y - r - 4);
  });
}

function drawLootZones() {
  currentMap.lootZones.forEach((lz, i) => {
    const x = tx(lz.x), y = ty(lz.y);
    const r = ts(lz.r);
    // Fill
    const grad = ctx.createRadialGradient(x, y, r*0.2, x, y, r);
    grad.addColorStop(0, 'rgba(255,109,0,0.25)');
    grad.addColorStop(1, 'rgba(255,109,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
    // Border
    ctx.strokeStyle = 'rgba(255,109,0,0.4)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
    // $ icon
    ctx.fillStyle = '#ff6d00';
    ctx.font = 'bold 10px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('$', x, y + 3);
  });
}

function drawTitle() {
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(currentMap.name, 24, 36);
  ctx.fillStyle = '#6b7280';
  ctx.font = '12px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(currentMap.nameEn + ' · ' + (currentMap.desc || ''), 24, 54);

  // Difficulty stars
  if (currentMap.difficulty) {
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = i < currentMap.difficulty ? '#ff3d4f' : '#333';
      ctx.font = '14px "Segoe UI"';
      ctx.textAlign = 'left';
      ctx.fillText('★', 24 + i * 18, 74);
    }
  }
  // Warfare tier
  if (currentMap.tier) {
    ctx.fillStyle = currentMap.tier === 'S' ? '#00e676' : currentMap.tier === 'A' ? '#76ff03' : currentMap.tier === 'B' ? '#ffab00' : '#ff3d4f';
    ctx.font = 'bold 16px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Tier ' + currentMap.tier, 24, 74);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  drawTerrain();

  // Draw buildings
  currentMap.buildings.forEach((b, i) => drawBuilding(b, i));

  // Draw zones
  drawHotZones();
  drawLootZones();

  // Draw points
  drawSpawnPoints();
  drawExtracts();

  // UI overlays
  drawCompassRose();
  drawScaleBar();
  drawTitle();

  // Watermark
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.font = 'bold 24px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('TACTICAL RADAR', canvas.width - 20, canvas.height - 10);
}

// ==================== INTERACTION ====================
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  mouseX = (e.clientX - rect.left) * scaleX;
  mouseY = (e.clientY - rect.top) * scaleY;

  const nx = mouseX / canvas.width;
  const ny = mouseY / canvas.height;
  const threshold = 0.03;

  hoveredPoint = null;

  // Check buildings
  for (let i = currentMap.buildings.length - 1; i >= 0; i--) {
    const b = currentMap.buildings[i];
    if (nx >= b.x - threshold && nx <= b.x + b.w + threshold &&
        ny >= b.y - threshold && ny <= b.y + b.h + threshold) {
      hoveredPoint = { type: 'building', index: i, data: b };
      break;
    }
  }

  // Check spawns
  if (!hoveredPoint) {
    for (let i = 0; i < currentMap.spawns.length; i++) {
      const sp = currentMap.spawns[i];
      if (Math.abs(nx - sp.x) < 0.015 && Math.abs(ny - sp.y) < 0.015) {
        hoveredPoint = { type: 'spawn', index: i };
        break;
      }
    }
  }

  // Check extracts
  if (!hoveredPoint) {
    for (let i = 0; i < currentMap.extracts.length; i++) {
      const ex = currentMap.extracts[i];
      if (Math.abs(nx - ex.x) < 0.02 && Math.abs(ny - ex.y) < 0.02) {
        hoveredPoint = { type: 'extract', index: i, data: ex };
        break;
      }
    }
  }

  // Tooltip
  if (hoveredPoint && hoveredPoint.data) {
    const d = hoveredPoint.data;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY - 8) + 'px';
    let html = `<strong>${d.label}</strong>`;
    if (d.floors) html += `<br>楼层: ${d.floors}层`;
    if (d.desc) html += `<br>${d.desc}`;
    if (d.highValue) html += `<br><span style="color:#ffab00">⚠ 高价值区域</span>`;
    if (d.type) html += `<br>类型: ${d.type}`;
    tooltip.innerHTML = html;
  } else {
    tooltip.style.display = 'none';
  }

  draw();
});

canvas.addEventListener('mouseleave', () => {
  hoveredPoint = null;
  tooltip.style.display = 'none';
  draw();
});

// ==================== MAP SELECTION ====================
function updateInfoPanel() {
  const panel = document.getElementById('infoPanel');
  let html = `<div class="stat-grid">`;
  if (currentMap.size) html += `<div class="stat-item"><span class="stat-label">地图尺寸</span><span class="stat-value">${currentMap.size}</span></div>`;
  if (currentMap.spawns) html += `<div class="stat-item"><span class="stat-label">出生点</span><span class="stat-value">${currentMap.spawns}个</span></div>`;
  if (currentMap.players) html += `<div class="stat-item"><span class="stat-label">对局人数</span><span class="stat-value">${currentMap.players}</span></div>`;
  if (currentMap.entryFee) html += `<div class="stat-item"><span class="stat-label">战备门槛</span><span class="stat-value">${currentMap.entryFee}</span></div>`;
  if (currentMap.modes) html += `<div class="stat-item"><span class="stat-label">可用模式</span><span class="stat-value">${currentMap.modes.join(' / ')}</span></div>`;
  if (currentMap.time) html += `<div class="stat-item"><span class="stat-label">对局时长</span><span class="stat-value">${currentMap.time}</span></div>`;
  if (currentMap.zones) html += `<div class="stat-item"><span class="stat-label">战区推进</span><span class="stat-value">${currentMap.zones}</span></div>`;
  if (currentMap.tier) html += `<div class="stat-item"><span class="stat-label">梯队评级</span><span class="stat-value" style="color:${currentMap.tier==='S'?'#00e676':currentMap.tier==='A'?'#76ff03':currentMap.tier==='B'?'#ffab00':'#ff3d4f'}">Tier ${currentMap.tier}</span></div>`;
  html += `</div>`;

  html += `<div class="legend-row">`;
  html += `<div class="legend-dot spawn">出生点</div>`;
  html += `<div class="legend-dot extract">撤离点</div>`;
  html += `<div class="legend-dot loot">高价值物资</div>`;
  html += `<div class="legend-dot danger">激烈交火区</div>`;
  if (currentMap.difficulty) html += `<div class="legend-dot boss">首领/BOSS</div>`;
  html += `</div>`;

  panel.innerHTML = html;
}

function selectMap(mapId) {
  const allMaps = [...MAPS.hazard, ...MAPS.warfare];
  currentMap = allMaps.find(m => m.id === mapId) || MAPS.hazard[0];
  renderSidebar();
  updateInfoPanel();
  draw();
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  const maps = currentMode === 'hazard' ? MAPS.hazard : MAPS.warfare;
  let html = `<div class="sidebar-section">${currentMode === 'hazard' ? '烽火地带 · 危险行动' : '全面战场 · 大战场'}</div>`;

  maps.forEach(m => {
    const active = currentMap && currentMap.id === m.id ? ' active' : '';
    const difficultyColor = m.difficulty
      ? ['#00e676','#76ff03','#ffab00','#ff6d00','#ff3d4f'][m.difficulty - 1]
      : (m.tier === 'S' ? '#00e676' : m.tier === 'A' ? '#76ff03' : m.tier === 'B' ? '#ffab00' : '#ff3d4f');
    html += `
      <div class="map-item${active}" data-map="${m.id}">
        <span class="difficulty-dot" style="background:${difficultyColor}"></span>
        <span class="map-name">${m.name}</span>
        <span class="map-mode">${m.modes ? m.modes[m.modes.length-1] : m.tier+'级'}</span>
      </div>`;
  });

  sidebar.innerHTML = html;

  // Click handlers
  sidebar.querySelectorAll('.map-item').forEach(item => {
    item.addEventListener('click', () => selectMap(item.dataset.map));
  });
}

// Mode tabs
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.dataset.mode;
    const maps = currentMode === 'hazard' ? MAPS.hazard : MAPS.warfare;
    selectMap(maps[0].id);
  });
});

// ==================== INIT ====================
resize();
renderSidebar();
updateInfoPanel();
draw();
</script>
</body>
</html>
